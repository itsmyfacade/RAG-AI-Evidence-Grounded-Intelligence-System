[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
  ".venv",
  ".pytest_cache",
  ".pytest_runtime",
  ".ruff_cache",
  ".chroma_local",
  "RAG-AI-Evidence-Grounded-Intelligence-System",
  "public-baseline-staging",
  "AEGIS-reconciliation-*",
  "data/*.db",
  "data/evaluation/results",
]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP037", "RUF012", "PLR0402", "BLE001"]
