name: AEGIS CI

on:
  push:
  pull_request:

jobs:
  test:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src tests generate_data.py aws_diagnostic.py

      - name: Run automated tests
        env:
          AEGIS_LLM: local
          AEGIS_DEPLOYMENT_PROFILE: lite
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: python -m pytest tests -v

      - name: Static quality checks
        run: python -m ruff check src tests generate_data.py aws_diagnostic.py --select E4,E7,E9,F

      - name: Frontend JavaScript syntax check
        run: node --check frontend/app.js
