name: AEGIS CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src tests generate_data.py aws_diagnostic.py

      - name: Run automated tests and API contracts
        env:
          AEGIS_LLM: local
          AEGIS_DEPLOYMENT_PROFILE: lite
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: >-
          python -m pytest tests -v
          --ignore=tests/test_rag.py
          --ignore=tests/test_foundation.py

      - name: Static quality checks
        run: python -m ruff check src tests generate_data.py aws_diagnostic.py bedrock_smoke.py mantle_smoke.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.txt --disable-pip --no-deps --progress-spinner off

      - name: Frontend JavaScript syntax check
        run: node --check frontend/app.js

  browser-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hosted-lite dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests
        env:
          AEGIS_DEPLOYMENT_PROFILE: lite
          AEGIS_LLM: local
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  standard-profile-security-report:
    name: Standard profile security report (informational)
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install standard-profile dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-standard.txt

      - name: Run standard-profile vector regression tests
        env:
          AEGIS_DEPLOYMENT_PROFILE: standard
          AEGIS_LLM: local
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: python -m pytest tests -q

      - name: Run Pyright type safety gate
        run: npx --yes pyright@1.1.413 --pythonpath "$(command -v python)" --project pyrightconfig.json

      - name: Audit standard-profile dependencies
        id: standard-audit
        if: always()
        shell: bash
        run: |
          set +e
          python -m pip install pip-audit
          pip-audit -r requirements-standard.txt --disable-pip --no-deps --progress-spinner off | tee standard-profile-pip-audit.txt
          audit_status=${PIPESTATUS[0]}
          {
            echo "### Standard-profile dependency audit"
            echo ""
            echo "This report is informational because the optional standard profile currently contains unresolved ChromaDB advisories."
            echo "pip-audit exit code: ${audit_status}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$audit_status" -ne 0 ]; then
            echo "::warning title=Standard profile advisories::Unresolved standard-profile dependency findings remain; see the uploaded audit report."
          fi
          exit 0

      - name: Upload standard-profile security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: standard-profile-security-report
          path: standard-profile-pip-audit.txt
          if-no-files-found: warn
