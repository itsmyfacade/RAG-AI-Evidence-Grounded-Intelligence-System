name: AEGIS CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    permissions:
      contents: read
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src tests tools generate_data.py aws_diagnostic.py

      - name: Validate release artifacts
        run: >-
          python -c "import json; from pathlib import Path; [json.loads(Path(p).read_text(encoding='utf-8')) for p in ('frontend/benchmark.json', 'frontend/recorded-demo.json', 'frontend/vercel.json')]; print('release JSON valid')"

      - name: Run automated tests and API contracts
        env:
          AEGIS_LLM: local
          AEGIS_DEPLOYMENT_PROFILE: lite
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: >-
          python -m pytest tests -v
          --ignore=tests/test_rag.py
          --ignore=tests/test_foundation.py

      - name: Static quality checks
        run: python -m ruff check src tests generate_data.py aws_diagnostic.py bedrock_smoke.py mantle_smoke.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: |
          python -m pip install pip-audit
          pip-audit --progress-spinner off

      - name: Frontend JavaScript syntax check
        run: node --check frontend/app.js && node --check frontend/review.js

  browser-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install hosted-lite dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests
        env:
          AEGIS_DEPLOYMENT_PROFILE: lite
          AEGIS_LLM: local
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore

  standard-profile-security-report:
    name: Standard profile security gate
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install standard-profile dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-standard.txt

      - name: Run standard-profile vector regression tests
        env:
          AEGIS_DEPLOYMENT_PROFILE: standard
          AEGIS_LLM: local
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: python -m pytest tests -q

      - name: Run Pyright type safety gate
        run: npx --yes pyright@1.1.413 --pythonpath "$(command -v python)" --project pyrightconfig.json

      - name: Check resolved dependency consistency
        run: python -m pip check

      - name: Audit standard-profile dependencies
        shell: bash
        run: |
          set -o pipefail
          python -m pip install pip-audit
          pip-audit --progress-spinner off | tee standard-profile-pip-audit.txt

      - name: Upload standard-profile security report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: standard-profile-security-report
          path: standard-profile-pip-audit.txt
          if-no-files-found: warn
