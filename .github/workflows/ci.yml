name: AEGIS CI

on:
  push:
  pull_request:

jobs:
  python-quality:
    permissions:
      contents: read
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile Python files
        run: python -m compileall -q src tests generate_data.py aws_diagnostic.py

      - name: Run automated tests and API contracts
        env:
          AEGIS_LLM: local
          AEGIS_DEPLOYMENT_PROFILE: lite
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: python -m pytest tests -v

      - name: Static quality checks
        run: python -m ruff check src tests generate_data.py aws_diagnostic.py bedrock_smoke.py mantle_smoke.py

      - name: Verify dependency consistency
        run: python -m pip check

      - name: Audit Python dependencies
        run: python -m pip install pip-audit && pip-audit -r requirements.txt --progress-spinner off

      - name: Frontend JavaScript syntax check
        run: node --check frontend/app.js

  browser-e2e:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install hosted-lite dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lite.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Chromium end-to-end tests
        env:
          AEGIS_DEPLOYMENT_PROFILE: lite
          AEGIS_LLM: local
          AEGIS_EMBEDDINGS: local
          AEGIS_EMBEDDING_LOCAL_FILES_ONLY: "true"
        run: npm run test:e2e

      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
